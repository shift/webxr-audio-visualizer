<!DOCTYPE html>
<html lang="en">
<head>
    <title>WebXR AR Audio Waveform Visualizer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #111;
            color: #fff;
            overflow: hidden; /* Hide scrollbars */
        }
        .button {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border: 1px solid #fff;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            z-index: 100;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #audio-button {
            bottom: 80px;
        }
        #ar-button {
            bottom: 20px;
        }
         #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="info">
        Click "Enable Audio" to allow microphone access, then start AR session.
    </div>

    <button id="audio-button" class="button">Enable Audio</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let line, analyser, dataArray;
        
        const FFT_SIZE = 2048; // Must be a power of 2
        let audioInitialized = false;

        init();
        animate();

        async function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            // Scene setup
            scene = new THREE.Scene();

            // Camera setup
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);
            
            // Add lighting
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // Audio Button
            const audioButton = document.getElementById('audio-button');
            audioButton.addEventListener('click', async () => {
                audioButton.disabled = true;
                audioButton.textContent = 'Requesting permission...';
                document.getElementById('info').textContent = 'Please allow microphone access in the popup.';
                
                await setupAudio();
                if (audioInitialized) {
                    audioButton.style.display = 'none';
                    arButton.style.display = 'block';
                } else {
                    audioButton.disabled = false;
                    audioButton.textContent = 'Enable Audio';
                }
            });

            // AR Button
            const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
            arButton.id = 'ar-button';
            arButton.className = 'button';
            arButton.style.display = 'none'; // Hidden until audio is enabled
            document.body.appendChild(arButton);
            
            // Handle window resizing
            window.addEventListener('resize', onWindowResize);
        }
        
        async function setupAudio() {
            try {
                // Get audio stream from microphone
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                
                // Create an analyser node
                analyser = audioContext.createAnalyser();
                analyser.fftSize = FFT_SIZE;
                
                // Connect the source to the analyser. 
                // We don't connect the analyser to the destination, so you won't hear the microphone input.
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                // Create the line geometry for the waveform
                const geometry = new THREE.BufferGeometry();
                const material = new THREE.LineBasicMaterial({ color: 0x00ff7f, linewidth: 3 });
                
                const positions = new Float32Array(bufferLength * 3);
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                
                line = new THREE.Line(geometry, material);
                // Position the waveform 1 meter in front of the user
                line.position.set(0, -0.2, -1);
                scene.add(line);
                
                audioInitialized = true;
                document.getElementById('info').textContent = 'Audio enabled! Click "Start AR" to begin the AR session.';

            } catch (err) {
                console.error('Error accessing microphone:', err);
                document.getElementById('info').textContent = 'Error: Could not access microphone. Please allow microphone access and try again.';
                // Reset button state
                const audioButton = document.getElementById('audio-button');
                audioButton.disabled = false;
                audioButton.textContent = 'Enable Audio';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // Update waveform if audio is initialized
            if (audioInitialized && analyser && line) {
                // Get the time-domain data from the analyser
                analyser.getByteTimeDomainData(dataArray);
                
                const positions = line.geometry.attributes.position.array;
                const bufferLength = analyser.frequencyBinCount;

                // Update the vertices of the line based on the waveform data
                for (let i = 0; i < bufferLength; i++) {
                    // Normalize the data to be between -1 and 1
                    const v = (dataArray[i] / 128.0) - 1.0; 
                    
                    // Spread the points along the x-axis
                    const x = (i / (bufferLength - 1) - 0.5) * 1.5; // Width of 1.5 units
                    
                    // Set the y position based on the audio data, scaled down
                    const y = v * 0.25; 
                    
                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    // z is 0 as it's a 2D waveform in 3D space
                    positions[i * 3 + 2] = 0;
                }

                // Tell three.js that the position attribute needs to be updated
                line.geometry.attributes.position.needsUpdate = true;
            }
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
